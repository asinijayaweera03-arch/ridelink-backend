spring.application.name=account-service

# Server
server.port=8081

# Persistent H2 file database (survives restarts)
spring.datasource.url=jdbc:h2:file:./data/accountdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create/update tables from your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console (visual DB browser in your browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console