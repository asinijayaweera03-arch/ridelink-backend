spring.application.name=ride-service

server.port=8083

# H2 persistent file database
spring.datasource.url=jdbc:h2:file:./data/ridedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Driver Service
ridelink.driver-service.base-url=http://localhost:8082

# Payment Service
ridelink.payment-service.base-url=http://localhost:8084
ridelink.payment-service.internal-api-key=${PAYMENT_INTERNAL_API_KEY:dev-only-internal-key-change-this-987654321}

# Inter-service HTTP timeouts
ridelink.http.connect-timeout=3s
ridelink.http.read-timeout=5s

# JWT
jwt.secret=${JWT_SECRET:dev-only-temporary-secret-change-this-1234567890abcdef}