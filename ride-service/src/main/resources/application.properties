spring.application.name=ride-service


server.port=8083


spring.datasource.url=jdbc:h2:file:./data/ridedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=update


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

driver-service.base-url=http://localhost:8082
jwt.secret=${JWT_SECRET:dev-only-temporary-secret-change-this-1234567890abcdef}
payment-service.base-url=http://localhost:8084
payment-service.internal-api-key=${PAYMENT_INTERNAL_API_KEY:dev-only-internal-key-change-this-987654321}